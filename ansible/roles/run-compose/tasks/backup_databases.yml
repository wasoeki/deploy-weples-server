---
- name: Put {{ item.1.name }} database info in current_db fact
  set_fact:
    current_db: "{{ item.1 }}"
  tags:
    - backup_db
    - backup
  
- name: Get needed {{ item.1.name }} volumes from {{ item.0.stack }} compose file
  ansible.builtin.shell:
    chdir: "{{ ansible_env.HOME }}/srv/{{ item.0.org }}/{{ item.0.stack }}/git/compose"
    # Command to know for each service if it contains a {{ item.1.name }} image
    # Could not map 2 arrays in a key:value way, so items with the same key must be linked
    # yq '.services | (keys | to_entries) + ([.[].image | test("{{ item.1.name }}*")] | to_entries)' compose.yml | tr -d '"'
    # Better one
    # yq --yaml-output '.services | to_entries | .[] | { (.key) : (.value.image | test("{{ item.1.name }}*")) }' compose.yml
    # To just output the path to shared volumes inside DB container
    # yq -y '[.services[] | select(.image | test("{{ item.1.name }}*")) | .volumes[0] | split(":")[1]]' compose.yml
    # To get all data desired in a YAML array
    # yq '[.services | to_entries | .[] | select(.value.image | test("{{ item.1.name }}*")) | { (.key) : "\(.value.container_name),\(.value.volumes[0] | split(":")[1])" }]' compose.yml
    cmd: |
      yq '.services | to_entries | .[] | select(.value.image | test("{{ item.1.name }}*")) | "\(.key),\(.value.container_name),\(.value.volumes[0] | split(":")[1])"' compose.yml | tr -d '"'
  register: vols
  changed_when: false
  tags:
    - backup_db
    - backup

- name: Show {{ current_db.name }} volumes in {{ item.0.stack }}
  debug:
    msg: "All {{ current_db.name | upper }} databases in {{ item.0.stack | upper }} compose file : {{ vols.stdout | split('\n') }}"
  tags:
    - backup_db
    - backup

