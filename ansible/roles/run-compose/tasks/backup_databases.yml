- name: Backup {{ current_db.name }} databases
  ansible.builtin.shell:
    chdir: "{{ ansible_env.HOME }}/srv/{{ item.0.org }}/{{ item.0.stack }}/git/compose"
    cmd: |
      . ./.env
      CONTAINER_HOSTNAME="{{ vl | split(',') | first }}"
      CONTAINER_NAME="{{ (vl | split(','))[1] }}"
      CONTAINER_SHARED_VOLUME="{{ vl | split(',') | last }}"
      sudo -E docker exec --env-file .env "${CONTAINER_NAME}" sh -c "{{ current_db.cmd.backup }}"
      sudo -E docker exec --env-file .env "${CONTAINER_NAME}" sh -c "ls -t ${CONTAINER_SHARED_VOLUME}/${CONTAINER_NAME}*"
  # environment: "{{ env_vars }}"
  register: db_backup_files
  when: "{{ vols.stdout | length > 0 }}"
  loop: "{{ vols.stdout | split('\n') }}"
  loop_control:
    loop_var: vl
  tags:   
    - backup_db
    - backup

- name: Show {{ current_db.name }} databases backup files
  debug:
    msg: "All {{ current_db.name | upper }} databases backup files for {{ item.0 | split(',') | first | upper }} hostname : {{ item.1.stdout }}"
  when: "{{ vols.stdout | length > 0 }}"
  with_together: 
  - "{{ vols.stdout | split('\n') }}"
  - "{{ db_backup_files.results }}"
  tags:
    - backup_db
    - backup